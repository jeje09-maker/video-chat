spring:
  application:
    name: videochat
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:h2:file:./data/videochat
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
  address: 0.0.0.0
