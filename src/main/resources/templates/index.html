<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="/css/index.css">
    
    <!-- 구글 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <title>CODEGRASS - VIDEOCHAT</title>
</head>
<body>
    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round">
                <span class="icon sun">☀️</span>
                <span class="icon moon">🌙</span>
            </div>
        </label>
    </div>

    <!-- 우측 상단 로그인 상태 표시 -->
    <div id="user-profile" class="user-profile hidden">
        <div class="avatar" id="user-avatar">👤</div>
        <div class="user-info">
            <span id="user-name"></span>
            <button id="logout-btn" class="text-btn">로그아웃</button>
        </div>
    </div>

    <div class="main-container">
        <div class="glass-card">
            <div class="logo-area">
                <div class="pulse-ring"></div>
                <div class="logo-icon">📸</div>
                <h1>VideoChat</h1>
                <p>쉽고 빠른 실시간 화상 회의</p>
            </div>
            
            <!-- 로그인 컨테이너 -->
            <div id="auth-container" class="auth-container">
                <h3>로그인하여 방 만들기</h3>
                <p style="margin-bottom: 20px;">참여만 하려면 아래 버튼을 누르세요.</p>
                
                <div class="social-login-group">
                    <button id="google-login-btn" class="social-btn google-btn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                        구글로 계속하기
                    </button>
                    <button id="kakao-login-btn" class="social-btn kakao-btn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e3/KakaoTalk_logo.svg" alt="Kakao">
                        카카오톡으로 계속하기
                    </button>
                </div>
                
                <div class="divider"><span>또는 이메일</span></div>
                
                <div class="email-login-group">
                    <input type="email" id="email-input" class="modern-input" placeholder="이메일" />
                    <input type="password" id="password-input" class="modern-input" placeholder="비밀번호" />
                    <button id="email-login-btn" class="primary-btn">로그인</button>
                    <button id="email-signup-btn" class="outline-btn" style="margin-top: 10px;">회원가입</button>
                </div>
                
                <div class="divider"><span>비회원</span></div>
                <button id="guest-join-btn" class="outline-btn">코드로 참여하기</button>
                <p id="auth-error" class="error-text hidden"></p>
            </div>

            <!-- 메인 앱 컨테이너 (로그인 후 또는 비회원 참여 클릭 시 표시) -->
            <div id="app-container" class="app-container hidden">
                <div class="action-tabs">
                    <button class="tab-btn active" data-target="create" id="tab-create">방 만들기</button>
                    <button class="tab-btn" data-target="join" id="tab-join">코드로 참여</button>
                </div>

                <div class="tab-content active" id="create-content">
                    <div id="create-unauth-msg" class="hidden" style="padding: 20px 0;">
                        <p class="error-text" style="display:block; margin-bottom:10px;">방 생성은 로그인한 회원만 가능합니다.</p>
                        <button id="back-to-login-btn" class="outline-btn">로그인 하러가기</button>
                    </div>
                    
                    <div id="create-auth-section">
                        <button id="generate-btn" class="primary-btn">새 회의 만들기</button>
                        <div id="room-info" class="hidden">
                            <p class="label">초대 코드</p>
                            <div class="code-box">
                                <span id="room-code"></span>
                                <button id="copy-btn" class="icon-btn" title="복사하기">📋</button>
                            </div>
                            <p class="help-text">친구에게 코드를 공유하세요!</p>
                            <p class="label">이름 입력</p>
                            <input type="text" id="create-name-input" class="modern-input" placeholder="이름을 입력하세요" autocomplete="off" style="margin-bottom: 10px;" />
                            <button id="start-btn" class="success-btn">방장으로 시작하기</button>
                            <p id="create-error" class="error-text hidden">이름을 입력해주세요!</p>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="join-content">
                    <p class="label">초대 코드 입력</p>
                    <input type="text" id="join-code-input" class="modern-input" placeholder="예: a1b2c3" autocomplete="off" style="margin-bottom: 10px;" />
                    <p class="label">이름 입력</p>
                    <input type="text" id="join-name-input" class="modern-input" placeholder="이름을 입력하세요" autocomplete="off" />
                    <button id="join-btn" class="primary-btn">참여자로 입장하기</button>
                    <p id="join-error" class="error-text hidden">코드와 이름을 입력해주세요!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">클립보드에 복사되었습니다!</div>

    <script src="/js/auth.js"></script>
    <script src="/js/index.js"></script>
</body>
</html>
